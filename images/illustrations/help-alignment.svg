  <g stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- center meeting point -->
    <circle cx="60" cy="60" r="7"/>
    <!-- top person -->
    <circle cx="60" cy="16" r="8"/>
    <path d="M52 22c3 5 6 7 8 7s5-2 8-7"/>
