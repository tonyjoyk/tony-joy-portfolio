    <!-- bottom-left person -->
    <circle cx="18" cy="98" r="8"/>
    <path d="M14 104c4 5 7 6 10 6s6-2 8-6"/>
    <path d="M26 90l22-20"/>
    <!-- bottom-right person -->
    <circle cx="102" cy="98" r="8"/>
    <path d="M94 104c4 5 7 6 10 6s6-2 8-6"/>
    <path d="M94 90l-22-20"/>
  </g>
</svg>
