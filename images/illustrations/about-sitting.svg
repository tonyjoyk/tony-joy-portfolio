<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Person sitting on flat ground, knees up, relaxed -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- flat ground -->
    <path d="M8 102h104"/>
    <!-- head -->
    <circle cx="48" cy="28" r="10"/>
    <!-- neck to torso, upright-ish then sit -->
    <path d="M48 38v22"/>
    <!-- torso to hips -->
    <path d="M48 60c-2 10 0 20 4 28"/>
    <!-- seat on ground -->
    <path d="M42 90c8 4 18 4 28 0"/>
    <!-- raised front knee (bent V) -->
    <path d="M58 88c14-18 22-28 28-36"/>
    <path d="M86 52c2 16 0 30-4 42"/>
    <!-- foot on ground -->
    <path d="M80 94h14"/>
    <!-- back leg tucked -->
    <path d="M46 90c-12 4-22 8-30 8"/>
    <!-- arm resting on raised knee -->
    <path d="M50 58c12 8 22 16 30 22"/>
    <!-- other arm propped behind -->
    <path d="M46 56c-10 8-16 18-18 30"/>
  </g>
</svg>
