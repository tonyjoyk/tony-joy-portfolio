<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Person at podium with visible mic capsule — talks / speaking -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- stage floor -->
    <path d="M8 106c28-2 56 1 84-1 12 0 20 1 28 3"/>
    <!-- podium body (open rect) -->
    <path d="M42 72v32"/>
    <path d="M42 104h40"/>
    <path d="M82 104V72"/>
    <!-- podium top shelf overhang -->
    <path d="M38 72h48"/>
    <!-- mic stand -->
    <path d="M62 72v-10"/>
    <!-- mic capsule (recognizable oval head) -->
    <path d="M56 52c0-8 3-14 6-14s6 6 6 14c0 4-3 6-6 6s-6-2-6-6z"/>
    <!-- grille lines on mic -->
    <path d="M58 50h8"/>
    <path d="M58 55h8"/>
    <!-- speaker head -->
    <circle cx="78" cy="30" r="10"/>
    <!-- neck / shoulders behind podium -->
    <path d="M78 41c-2 6-4 10-4 14"/>
    <path d="M66 58c6-8 10-12 12-12s8 6 14 16"/>
    <!-- gesturing arm -->
    <path d="M68 56c-12 2-20 10-24 20"/>
  </g>
</svg>
