<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Person sitting playing with 3 stacked blocks -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M10 104c24-3 48 2 72-1s28-1 40 3"/>
    <!-- bottom block (open paths) -->
    <path d="M70 88h30"/>
    <path d="M100 88v16"/>
    <path d="M100 104H70"/>
    <path d="M70 104V88"/>
    <!-- middle block offset -->
    <path d="M74 72h26"/>
    <path d="M100 72v16"/>
    <path d="M100 88H74"/>
    <path d="M74 88V72"/>
    <!-- top block -->
    <path d="M78 58h20"/>
    <path d="M98 58v14"/>
    <path d="M98 72H78"/>
    <path d="M78 72V58"/>
    <!-- person sitting left -->
    <circle cx="36" cy="50" r="9"/>
    <path d="M36 60c0 10 2 18 6 26"/>
    <!-- legs toward blocks -->
    <path d="M42 86c14 2 26 4 34 2"/>
    <path d="M40 90c10 8 20 10 30 8"/>
    <!-- arm placing / touching top block -->
    <path d="M40 68c14 2 24 6 34 10"/>
    <!-- bracing arm -->
    <path d="M34 68c-8 10-12 18-12 26"/>
  </g>
</svg>
